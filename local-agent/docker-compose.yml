# local-agent on ai-gantry — Gemini + Telegram (Telegram polls outbound).
# No ports, no gateway, no dashboard: the healthcheck is an exit code.
# Image: distroless/static + gantry + MCP tools from mcp.toml (`gantry tools-fetch`).
# Docs: docs/telegram.md, docs/google-workspace.md, docs/strava.md, docs/garmin.md, docs/web-search.md, docs/cast.md, docs/youtube.md, docs/math.md, docs/flights.md, docs/rentals.md, docs/cars.md
# Cast mDNS: set NETWORK_MODE=host in .env on the Linux home server (docs/cast.md).

services:
  gantry:
    build:
      context: .
      args:
        # Busts tools-fetch so download_tag=latest re-resolves (make build sets this).
        - TOOLS_CACHEBUST
    image: ${GANTRY_IMAGE:-gantry-local-agent:local}
    container_name: gantry
    restart: unless-stopped
    # bridge (default) for Docker Desktop / normal NAT; host for Cast mDNS on Linux.
    network_mode: ${NETWORK_MODE:-bridge}
    # Match the deploy user on the server (id -u / id -g). Avoids UID 65532 data fights.
    user: "${GANTRY_UID:-1000}:${GANTRY_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      # MCP children resolve $XDG_CONFIG_HOME/... via HOME (garmin session etc.).
      HOME: /data
      # Container clock defaults to UTC without this — cron + "what time is it" go wrong.
      TZ: ${TZ:-America/Los_Angeles}
      CRON_TZ: ${TZ:-America/Los_Angeles}
      # --- gantry core (see shotah/ai-gantry §5.1) ---------------------------
      # Chat provider is any OpenAI-compatible endpoint. Defaults: Gemini via
      # the familiar GEMINI_* keys; override LLM_* directly for xAI/Ollama/etc.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_API_KEY: ${LLM_API_KEY:-${GEMINI_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-${GEMINI_MODEL:-gemini-3.5-flash}}
      CHANNEL: telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-}
      PERSONA_DIR: /persona
      DATA_DIR: /data
      MCP_MANIFEST: /etc/gantry/mcp.toml
      STREAM_REPLIES: ${STREAM_REPLIES:-false}
      TOOL_TRACE: ${TOOL_TRACE:-compact}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # --- MCP child processes inherit everything below ----------------------
      # Gemini Google Search MCP (shotah/mcp-gemini-search) — same key as chat.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      # Google MCP (shotah/google-mcp) — OAuth client + token dir (docs/google-workspace.md).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL:-}
      WORKSPACE_MCP_CREDENTIALS_DIR: /data/.config/google-mcp/credentials
      # Strava MCP subprocess inherits these (see docs/strava.md). Token persists on the mount.
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_TOKEN_PATH: /data/.config/strava/tokens.json
      # Garmin MCP: session.json on the mount; optional chat MFA needs email/password
      # (docs/garmin.md, docs/auth.md). Never put passwords in Telegram.
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
      # Cast MCP (mcp-beam): no API keys. Optional knobs in docs/cast.md.
      MCP_BEAM_LOG_LEVEL: ${MCP_BEAM_LOG_LEVEL:-info}
      # YouTube Data API v3 MCP (youtube-go-mcp v1+) — docs/youtube.md
      YOUTUBE_OAUTH_PATH: /data/.config/youtube/oauth.json
      YOUTUBE_OAUTH_CLIENT_ID: ${YOUTUBE_OAUTH_CLIENT_ID:-${YOUTUBE_OAUTH_CLIENT_ID:-}}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${YOUTUBE_OAUTH_CLIENT_SECRET:-${YOUTUBE_OAUTH_CLIENT_SECRET:-}}
      # Flights MCP (flights-search-mcp) — SerpAPI Google Flights (docs/flights.md)
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      # Rentals MCP (rentals-search-mcp) — RentCast long-term residential (docs/rentals.md)
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
      # Cars MCP (cars-search-mcp) — MarketCheck inventory (docs/cars.md)
      MARKETCHECK_API_KEY: ${MARKETCHECK_API_KEY:-}
      # Optional: persist local usage counter on the data volume
      MARKETCHECK_USAGE_FILE: ${MARKETCHECK_USAGE_FILE:-/data/marketcheck-usage.json}
    volumes:
      # Persona markdown (SOUL.md USER.md TOOLS.md ...) — the system prompt
      - ./persona:/persona:ro
      # MCP server manifest — the one structured config file
      - ./mcp.toml:/etc/gantry/mcp.toml:ro
      # gantry.db + MCP tool state under data/.config/* (same layout as native /opt/gantry/data).
      # Auth writes: make google-auth | strava-auth | garmin-auth | youtube-auth
      - ./data:/data
    mem_limit: 1g
    cpus: 4.0
    mem_reservation: 128m
    healthcheck:
      # Exec form + full path — distroless has no shell (never CMD-SHELL).
      test: ["CMD", "/usr/local/bin/gantry", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
