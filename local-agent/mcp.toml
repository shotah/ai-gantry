# MCP server manifest for local-agent (mounted read-only at /etc/gantry/mcp.toml).
# Being listed here IS the grant — no bundles layer. Tools reach the model as
# {server}__{tool}. Binaries are baked into the image by the Dockerfile; auth
# material lives under data/.config/* (Docker + native).
#
# Optional auth_* : `gantry auth <name>` runs auth_command (default: command)
# with auth_args. Omit when the package has no auth entrypoint.
#
# Optional download_url + download_tag : native deploy (`make remote-native-fetch`)
# GETs the archive into /opt/gantry/bin. Placeholders: {os} {arch} {tag} {version}
# (version = tag without leading "v"). Set download_tag once — or "latest" to
# resolve the current GitHub release at `gantry tools-plan` time (handy while
# testing; pin a tag for reproducible deploys). `gantry tools-plan` lists these.

# Google MCP (shotah/google-mcp) — docs/google-workspace.md
# Server id "google" → tools like google__calendar_list_events.
# --preset everyday ≈ gmail+calendar+docs+sheets+tasks, core, edit (~23 tools).
# Auth: `google-mcp auth` via gantry, or `make google-auth` (Python helper).
[[server]]
name = "google"
command = "google-mcp"
args = ["--preset", "everyday"]
auth_args = ["auth"]
download_tag = "latest"
download_url = "https://github.com/shotah/google-mcp/releases/download/{tag}/google-mcp_{version}_{os}_{arch}.tar.gz"

# Strava workouts (shotah/go-strava-mcp) — docs/strava.md
# No calendar tools (good). Hide release-only utility_* (self-update / check)
# so the agent cannot "upgrade" the binary mid-session.
[[server]]
name = "strava"
command = "strava-mcp"
auth_args = ["auth"]
exclude = ["utility_*"]
download_tag = "latest"
download_url = "https://github.com/shotah/go-strava-mcp/releases/download/{tag}/strava-mcp_{version}_{os}_{arch}.tar.gz"

# Garmin sleep / body battery / weight (shotah/go-garmin) — docs/garmin.md
# --tool-tier core ≈ 10 recovery/coaching tools (not the full ~100).
# Belt-and-suspenders: never publish Connect "calendar" / menstrual calendar —
# those names steal Google Calendar asks (`garmin__calendar_get` literally says
# "what's on my calendar" in its blurb). Rename upstream later; exclude here.
[[server]]
name = "garmin"
command = "garmin"
args = ["mcp", "--tool-tier", "core"]
auth_args = ["login"]
exclude = ["calendar_*", "*_calendar", "*_calendar_*"]
download_tag = "latest"
download_url = "https://github.com/shotah/go-garmin/releases/download/{tag}/garmin_{version}_{os}_{arch}.tar.gz"

# Web search via Gemini Grounding (shotah/mcp-gemini-search) — docs/web-search.md
# Binary name stays mcp-gemini-google-search (goreleaser project_name).
[[server]]
name = "google-search"
command = "mcp-gemini-google-search"
download_tag = "latest"
download_url = "https://github.com/shotah/mcp-gemini-search/releases/download/{tag}/mcp-gemini-google-search_{version}_{os}_{arch}.tar.gz"

# Chromecast / Nest / DLNA (shotah/mcp-beam) — docs/cast.md
# mDNS discovery needs NETWORK_MODE=host on the Linux server.
[[server]]
name = "cast"
command = "mcp-beam"
download_tag = "latest"
download_url = "https://github.com/shotah/mcp-beam/releases/download/{tag}/mcp-beam_{version}_{os}_{arch}.tar.gz"

# YouTube Data API v3 (shotah/youtube-go-mcp) — docs/youtube.md
[[server]]
name = "youtube"
command = "youtube-go-mcp"
auth_args = ["auth", "oauth", "--out", "${YOUTUBE_OAUTH_PATH}"]
download_tag = "latest"
download_url = "https://github.com/shotah/youtube-go-mcp/releases/download/{tag}/youtube-go-mcp_{version}_{os}_{arch}.tar.gz"

# Calculator (shotah/mcp-go-math) — docs/math.md
# Tiny surface on purpose: evaluate + convert. Use for any non-trivial arithmetic.
[[server]]
name = "math"
command = "mcp-go-math"
download_tag = "latest"
download_url = "https://github.com/shotah/mcp-go-math/releases/download/{tag}/mcp-go-math_{version}_{os}_{arch}.tar.gz"

# Google Flights search via SerpAPI (shotah/flights-search-mcp) — docs/flights.md
