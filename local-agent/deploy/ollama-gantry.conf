# Installed by gantry deploy (deploy/install.sh) as
# /etc/systemd/system/ollama.service.d/gantry.conf
#
# Dedicated agent box tuning. install.sh reinstalls this whenever it changes and
# restarts ollama (which drops the resident model — the next turn is cold).
# To revert: delete the file, daemon-reload, restart ollama.
[Service]
# Never unload. Default keep-alive (5m) makes every idle gap pay a full model
# reload plus cold prompt eval.
Environment=OLLAMA_KEEP_ALIVE=-1

# Persona + ~60 tool schemas + history routinely exceed Ollama's small default
# num_ctx. Overflowing it forces context shifting and re-prefill on every turn,
# which is the main source of "time to first response" lag. 96GB has the room.
Environment=OLLAMA_CONTEXT_LENGTH=49152

# Optional, measure before keeping (both trade a little quality/compat for
# faster prefill and much smaller KV cache):
# Environment=OLLAMA_FLASH_ATTENTION=1
# Environment=OLLAMA_KV_CACHE_TYPE=q8_0
