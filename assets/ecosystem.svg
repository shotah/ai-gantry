<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="How the four repos talk. Gantree writes files. Mouths and the crane dial a mailbox or a vendor. The crane never listens.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="55%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="40%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="50%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f59e0b" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <symbol id="mini-gantry" viewBox="0 0 160 88">
      <rect x="8" y="78" width="144" height="10" rx="2" fill="url(#bed)" stroke="#44403c" stroke-width="1"/>
      <rect x="18" y="16" width="7" height="62" rx="1" fill="url(#post)"/>
      <rect x="135" y="16" width="7" height="62" rx="1" fill="url(#post)"/>
      <rect x="12" y="10" width="136" height="12" rx="2" fill="url(#beam)"/>
      <rect x="18" y="13" width="124" height="3" rx="1" fill="#fafaf9" opacity="0.5"/>
      <rect x="66" y="8" width="28" height="16" rx="2" fill="#d6d3d1"/>
      <rect x="74" y="24" width="12" height="14" rx="1" fill="#a8a29e"/>
      <rect x="64" y="40" width="32" height="18" rx="3" fill="url(#chip)" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="80" y="53" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.6">MODEL</text>
    </symbol>
    <marker id="arr-gold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#f59e0b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1280" height="460" fill="url(#sky)"/>
  <rect width="1280" height="460" fill="url(#grid)"/>
  <ellipse cx="780" cy="250" rx="320" ry="150" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="640" y="34" fill="#f59e0b" font-size="16" font-weight="700" letter-spacing="6">THE FAMILY</text>
    <text x="640" y="54" fill="#a8a29e" font-size="12" letter-spacing="3">FOUR REPOS, ONE CRANE</text>
  </g>

  <!-- Gantree: operator plane, not in the turn -->
  <g transform="translate(360,70)" filter="url(#soft)">
    <rect x="0" y="0" width="520" height="52" rx="5" fill="#27272a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="10" width="72" height="32" rx="3" fill="#0c0d10"/>
    <g fill="#34d399">
      <circle cx="26" cy="26" r="3"/>
      <circle cx="40" cy="26" r="3" opacity="0.5"/>
      <circle cx="54" cy="26" r="3" opacity="0.35"/>
    </g>
    <text x="116" y="24" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2">GANTREE</text>
    <text x="116" y="42" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.8">shipping yard / never in the turn</text>
  </g>

  <!-- Dashed pull from yard to crane -->
  <path d="M800 122 C830 142 850 158 880 188" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7" marker-end="url(#arr-gold)"/>
  <text x="648" y="140" fill="#78716c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.1">pull, don't punch</text>

  <!-- Mouths we own -->
  <g transform="translate(48,168)" filter="url(#soft)">
    <rect x="28" y="0" width="44" height="16" rx="5" fill="url(#gold)"/>
    <path d="M20 18 h60 v118 a22 22 0 0 1 -60 0 z" fill="url(#gold)"/>
    <rect x="32" y="14" width="40" height="5" rx="2" fill="#fde68a" opacity="0.45"/>
    <rect x="30" y="32" width="40" height="78" rx="6" fill="#0c0d10"/>
    <rect x="36" y="42" width="24" height="8" rx="2" fill="#292524"/>
    <rect x="40" y="56" width="20" height="7" rx="2" fill="#44403c"/>
    <rect x="48" y="70" width="16" height="7" rx="2" fill="#f59e0b" opacity="0.85"/>
    <rect x="36" y="86" width="26" height="7" rx="2" fill="#44403c"/>
    <circle cx="50" cy="122" r="8" fill="#0c0d10"/>
    <circle cx="50" cy="122" r="3.4" fill="#34d399"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="98" y="330" text-anchor="middle" fill="#e7e5e4" font-size="12" font-weight="700" letter-spacing="1.4">PENDANT</text>
    <text x="98" y="346" text-anchor="middle" fill="#a8a29e" font-size="9" letter-spacing="1">phone PWA</text>
  </g>

  <g transform="translate(168,188)" filter="url(#soft)">
    <rect x="8" y="36" width="88" height="52" rx="8" fill="url(#gold)" stroke="#b45309" stroke-width="1.2"/>
    <rect x="18" y="44" width="44" height="22" rx="3" fill="#0c0d10"/>
    <text x="40" y="59" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700">KIT</text>
    <circle cx="24" cy="96" r="11" fill="#0c0d10" stroke="#78716c" stroke-width="3"/>
    <circle cx="80" cy="96" r="11" fill="#0c0d10" stroke="#78716c" stroke-width="3"/>
    <circle cx="92" cy="62" r="7" fill="#fde68a"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="220" y="330" text-anchor="middle" fill="#e7e5e4" font-size="12" font-weight="700" letter-spacing="1.4">CAB</text>
    <text x="220" y="346" text-anchor="middle" fill="#a8a29e" font-size="9" letter-spacing="1">Android Auto</text>
  </g>

  <!-- Mailbox -->
  <g transform="translate(380,178)" filter="url(#soft)">
    <polygon points="120,6 214,54 214,146 120,194 30,146 30,54" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="120,24 196,64 196,136 120,176 50,136 50,64" fill="#0c0d10"/>
    <g fill="#34d399">
      <circle cx="96" cy="100" r="4"/>
      <circle cx="120" cy="100" r="4" opacity="0.55"/>
      <circle cx="144" cy="100" r="4" opacity="0.35"/>
    </g>
    <text x="120" y="132" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2">MAILBOX</text>
    <text x="120" y="150" text-anchor="middle" fill="#78716c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">gantry-pendant / DO</text>
  </g>

  <!-- Crane (the product) -->
  <g transform="translate(720,148)" filter="url(#soft)">
    <use xlink:href="#mini-gantry" href="#mini-gantry" x="0" y="0" width="240" height="132"/>
    <circle cx="24" cy="148" r="4" fill="#34d399"/>
    <text x="36" y="152" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.4">ai-gantry</text>
    <text x="120" y="176" text-anchor="middle" fill="#e7e5e4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.6">THE CRANE</text>
  </g>

  <!-- Vendor mouth: not via mailbox -->
  <g transform="translate(1048,168)" filter="url(#soft)">
    <rect x="0" y="0" width="164" height="72" rx="6" fill="#27272a" stroke="#34d399" stroke-width="1.5"/>
    <text x="82" y="32" text-anchor="middle" fill="#e7e5e4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.2">TELEGRAM</text>
    <text x="82" y="52" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="0.8">Discord / Slack too</text>
  </g>
  <g transform="translate(1048,260)" filter="url(#soft)">
    <rect x="0" y="0" width="164" height="56" rx="6" fill="#1c1917" stroke="#78716c" stroke-width="1.2"/>
    <text x="82" y="24" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">LLM SOCKET</text>
    <text x="82" y="42" text-anchor="middle" fill="#78716c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">OpenAI-compat</text>
  </g>
  <g transform="translate(1048,332)">
    <rect x="0" y="0" width="164" height="40" rx="6" fill="#1c1917" stroke="#78716c" stroke-dasharray="4 3" stroke-width="1.2"/>
    <text x="82" y="26" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">MCP optional</text>
  </g>

  <!-- Wires: mouths we own both dial in -->
  <path d="M128 200 C240 160 330 168 408 210" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85" marker-end="url(#arr-gold)"/>
  <path d="M258 250 C320 236 360 228 408 248" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85" marker-end="url(#arr-gold)"/>
  <text x="200" y="168" fill="#78716c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.2">wss in</text>

  <!-- Crane dials the mailbox (outbound) -->
  <path d="M720 236 C680 214 650 214 596 236" fill="none" stroke="#34d399" stroke-width="1.7" opacity="0.9" marker-end="url(#arr-green)"/>
  <text x="628" y="204" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.1">outbound wss</text>

  <!-- Crane dials Telegram (outbound, no mailbox) -->
  <path d="M960 214 C1000 204 1024 200 1048 198" fill="none" stroke="#34d399" stroke-width="1.7" opacity="0.9" marker-end="url(#arr-green)"/>
  <text x="992" y="186" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">outbound</text>

  <!-- Crane to LLM / MCP -->
  <path d="M960 268 C1000 278 1024 284 1048 286" fill="none" stroke="#78716c" stroke-width="1.3" opacity="0.8" marker-end="url(#arr-gold)"/>
  <path d="M900 328 C980 348 1020 350 1048 348" fill="none" stroke="#78716c" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7" marker-end="url(#arr-gold)"/>

  <rect x="200" y="418" width="880" height="26" rx="4" fill="#0c0a09"/>
  <text x="640" y="436" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">crane opens zero inbound ports / three doors, one household</text>
</svg>
