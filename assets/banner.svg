<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="ai-gantry - the crane. A long-horizon AI harness around one model. Nothing listens.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="55%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="40%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="50%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="32%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f59e0b" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="640" cy="200" rx="300" ry="130" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="640" y="38" fill="#f59e0b" font-size="16" font-weight="700" letter-spacing="6">THE CRANE</text>
    <text x="640" y="58" fill="#a8a29e" font-size="12" letter-spacing="3.2">LONG-HORIZON HARNESS</text>
  </g>

  <!-- Machine bed -->
  <rect x="120" y="318" width="1040" height="54" rx="6" fill="url(#bed)" stroke="#44403c" stroke-width="2"/>
  <g stroke="#57534e" stroke-width="1.5" opacity="0.7">
    <line x1="160" y1="336" x2="1120" y2="336"/>
    <line x1="160" y1="354" x2="1120" y2="354"/>
    <line x1="240" y1="318" x2="240" y2="372"/>
    <line x1="400" y1="318" x2="400" y2="372"/>
    <line x1="560" y1="318" x2="560" y2="372"/>
    <line x1="720" y1="318" x2="720" y2="372"/>
    <line x1="880" y1="318" x2="880" y2="372"/>
    <line x1="1040" y1="318" x2="1040" y2="372"/>
  </g>

  <!-- Gantry posts + bridge -->
  <g filter="url(#soft)">
    <rect x="210" y="112" width="36" height="216" rx="4" fill="url(#post)"/>
    <rect x="1034" y="112" width="36" height="216" rx="4" fill="url(#post)"/>
    <rect x="190" y="100" width="900" height="42" rx="5" fill="url(#beam)"/>
    <rect x="210" y="112" width="860" height="8" rx="2" fill="#fafaf9" opacity="0.5"/>
    <g stroke="#57534e" stroke-width="2" opacity="0.55">
      <line x1="280" y1="100" x2="320" y2="142"/>
      <line x1="320" y1="100" x2="280" y2="142"/>
      <line x1="400" y1="100" x2="440" y2="142"/>
      <line x1="440" y1="100" x2="400" y2="142"/>
      <line x1="840" y1="100" x2="880" y2="142"/>
      <line x1="880" y1="100" x2="840" y2="142"/>
      <line x1="960" y1="100" x2="1000" y2="142"/>
      <line x1="1000" y1="100" x2="960" y2="142"/>
    </g>
  </g>

  <!-- Carriage + spindle holding the model (the harness around the Completer) -->
  <g transform="translate(596,100)" filter="url(#soft)">
    <rect x="0" y="0" width="88" height="48" rx="4" fill="#d6d3d1"/>
    <rect x="8" y="8" width="72" height="10" rx="2" fill="#78716c"/>
    <rect x="30" y="40" width="28" height="18" rx="2" fill="#a8a29e"/>
    <rect x="38" y="58" width="12" height="48" rx="2" fill="#a8a29e"/>
    <g fill="#f59e0b">
      <rect x="18" y="104" width="14" height="10" rx="2"/>
      <rect x="56" y="104" width="14" height="10" rx="2"/>
      <rect x="22" y="112" width="6" height="22" rx="1"/>
      <rect x="60" y="112" width="6" height="22" rx="1"/>
    </g>
    <rect x="6" y="128" width="76" height="42" rx="5" fill="url(#chip)" stroke="#f59e0b" stroke-width="2"/>
    <g fill="#f59e0b">
      <rect x="18" y="124" width="8" height="5" rx="1"/>
      <rect x="40" y="124" width="8" height="5" rx="1"/>
      <rect x="62" y="124" width="8" height="5" rx="1"/>
    </g>
    <text x="44" y="154" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1">MODEL</text>
  </g>

  <!-- Harness state on the bed; MCP is optional and sits off the hot path -->
  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12">
    <rect x="260" y="286" width="104" height="32" rx="4" fill="#27272a" stroke="#78716c"/>
    <text x="312" y="307" text-anchor="middle" fill="#e7e5e4">PERSONA</text>

    <rect x="376" y="286" width="96" height="32" rx="4" fill="#27272a" stroke="#78716c"/>
    <text x="424" y="307" text-anchor="middle" fill="#e7e5e4">SELF.md</text>

    <rect x="484" y="286" width="96" height="32" rx="4" fill="#27272a" stroke="#78716c"/>
    <text x="532" y="307" text-anchor="middle" fill="#e7e5e4">MEMORY</text>

    <rect x="592" y="292" width="96" height="26" rx="4" fill="none" stroke="#f59e0b" stroke-dasharray="4 3" opacity="0.75"/>
    <text x="640" y="310" text-anchor="middle" fill="#fde68a" font-size="10">MODEL</text>

    <rect x="700" y="286" width="84" height="32" rx="4" fill="#27272a" stroke="#78716c"/>
    <text x="742" y="307" text-anchor="middle" fill="#e7e5e4">CRON</text>

    <rect x="796" y="286" width="88" height="32" rx="4" fill="#27272a" stroke="#78716c"/>
    <text x="840" y="307" text-anchor="middle" fill="#e7e5e4">WATCH</text>

    <rect x="896" y="286" width="78" height="32" rx="4" fill="#1c1917" stroke="#78716c" stroke-dasharray="4 3" opacity="0.75"/>
    <text x="935" y="307" text-anchor="middle" fill="#a8a29e">MCP</text>
  </g>

  <!-- Outbound only: the crane dials out, nothing listens -->
  <g fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M1048 248 c28 -16 50 -16 78 0"/>
    <path d="M1060 262 c22 -11 40 -11 64 0"/>
    <path d="M1072 276 c16 -8 28 -8 44 0"/>
  </g>
  <polygon points="1128,244 1144,248 1128,260" fill="#34d399" opacity="0.85"/>
  <text x="1096" y="228" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.2">outbound</text>
  <text x="1096" y="300" fill="#57534e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">zero inbound ports</text>
</svg>
