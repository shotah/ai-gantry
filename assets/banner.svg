<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="ai-gantry — an AI harness for long-horizon planning">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15202b"/>
      <stop offset="55%" stop-color="#1c2a38"/>
      <stop offset="100%" stop-color="#243746"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7e2ec"/>
      <stop offset="45%" stop-color="#9fb3c5"/>
      <stop offset="100%" stop-color="#6d8498"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5f7386"/>
      <stop offset="50%" stop-color="#a8bbc9"/>
      <stop offset="100%" stop-color="#5f7386"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a48"/>
      <stop offset="100%" stop-color="#17232e"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5164"/>
      <stop offset="100%" stop-color="#243746"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="28%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fa3b4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Atmosphere -->
  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="640" cy="210" rx="280" ry="150" fill="url(#glow)"/>

  <!-- Category stamp — repo name stays in the README heading -->
  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="640" y="40" fill="#e8a317" font-size="16" font-weight="700" letter-spacing="5">AN AI HARNESS</text>
    <text x="640" y="60" fill="#9fb3c5" font-size="12" letter-spacing="3.5">LONG-HORIZON PLANNING</text>
  </g>

  <!-- Machine bed -->
  <rect x="120" y="318" width="1040" height="54" rx="6" fill="url(#bed)" stroke="#3d5366" stroke-width="2"/>
  <g stroke="#6f8799" stroke-width="1.5" opacity="0.55">
    <line x1="160" y1="336" x2="1120" y2="336"/>
    <line x1="160" y1="354" x2="1120" y2="354"/>
    <line x1="240" y1="318" x2="240" y2="372"/>
    <line x1="400" y1="318" x2="400" y2="372"/>
    <line x1="560" y1="318" x2="560" y2="372"/>
    <line x1="720" y1="318" x2="720" y2="372"/>
    <line x1="880" y1="318" x2="880" y2="372"/>
    <line x1="1040" y1="318" x2="1040" y2="372"/>
  </g>

  <!-- Gantry posts -->
  <g filter="url(#soft)">
    <rect x="210" y="112" width="36" height="216" rx="4" fill="url(#post)"/>
    <rect x="1034" y="112" width="36" height="216" rx="4" fill="url(#post)"/>
  </g>

  <!-- Bridge / beam -->
  <g filter="url(#soft)">
    <rect x="190" y="100" width="900" height="42" rx="5" fill="url(#beam)"/>
    <rect x="210" y="112" width="860" height="8" rx="2" fill="#eef4f8" opacity="0.55"/>
    <g stroke="#4d6274" stroke-width="2" opacity="0.55">
      <line x1="280" y1="100" x2="320" y2="142"/>
      <line x1="320" y1="100" x2="280" y2="142"/>
      <line x1="400" y1="100" x2="440" y2="142"/>
      <line x1="440" y1="100" x2="400" y2="142"/>
      <line x1="840" y1="100" x2="880" y2="142"/>
      <line x1="880" y1="100" x2="840" y2="142"/>
      <line x1="960" y1="100" x2="1000" y2="142"/>
      <line x1="1000" y1="100" x2="960" y2="142"/>
    </g>
  </g>

  <!-- Carriage + spindle holding the model (the harness around the Completer) -->
  <g transform="translate(596,100)" filter="url(#soft)">
    <rect x="0" y="0" width="88" height="48" rx="4" fill="#c9d7e3"/>
    <rect x="8" y="8" width="72" height="10" rx="2" fill="#6d8498"/>
    <rect x="30" y="40" width="28" height="18" rx="2" fill="#8fa3b4"/>
    <rect x="38" y="58" width="12" height="48" rx="2" fill="#b7c7d4"/>
    <g fill="#e8a317">
      <rect x="18" y="104" width="14" height="10" rx="2"/>
      <rect x="56" y="104" width="14" height="10" rx="2"/>
      <rect x="22" y="112" width="6" height="22" rx="1"/>
      <rect x="60" y="112" width="6" height="22" rx="1"/>
    </g>
    <!-- model chip -->
    <rect x="6" y="128" width="76" height="42" rx="5" fill="url(#chip)" stroke="#f0b429" stroke-width="2"/>
    <g fill="#e8a317">
      <rect x="18" y="124" width="8" height="5" rx="1"/>
      <rect x="40" y="124" width="8" height="5" rx="1"/>
      <rect x="62" y="124" width="8" height="5" rx="1"/>
    </g>
    <text x="44" y="154" text-anchor="middle" fill="#f4f7fa" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1">MODEL</text>
    <g stroke="#f0b429" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <line x1="86" y1="138" x2="102" y2="130"/>
      <line x1="86" y1="149" x2="106" y2="149"/>
      <line x1="86" y1="160" x2="102" y2="168"/>
    </g>
  </g>

  <!-- Harness state on the bed; MCP is optional and sits off the hot path -->
  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12">
    <rect x="260" y="286" width="104" height="32" rx="4" fill="#3a4f60" stroke="#6f8799"/>
    <text x="312" y="307" text-anchor="middle" fill="#c9d7e3">PERSONA</text>

    <rect x="376" y="286" width="96" height="32" rx="4" fill="#3a4f60" stroke="#6f8799"/>
    <text x="424" y="307" text-anchor="middle" fill="#c9d7e3">SELF.md</text>

    <rect x="484" y="286" width="96" height="32" rx="4" fill="#3a4f60" stroke="#6f8799"/>
    <text x="532" y="307" text-anchor="middle" fill="#c9d7e3">MEMORY</text>

    <rect x="592" y="292" width="96" height="26" rx="4" fill="none" stroke="#f0b429" stroke-dasharray="4 3" opacity="0.75"/>
    <text x="640" y="310" text-anchor="middle" fill="#c9a227" font-size="10">MODEL</text>

    <rect x="700" y="286" width="84" height="32" rx="4" fill="#3a4f60" stroke="#6f8799"/>
    <text x="742" y="307" text-anchor="middle" fill="#c9d7e3">CRON</text>

    <rect x="796" y="286" width="88" height="32" rx="4" fill="#3a4f60" stroke="#6f8799"/>
    <text x="840" y="307" text-anchor="middle" fill="#c9d7e3">WATCH</text>

    <rect x="896" y="286" width="78" height="32" rx="4" fill="#2a3a48" stroke="#6f8799" stroke-dasharray="4 3" opacity="0.7"/>
    <text x="935" y="307" text-anchor="middle" fill="#8fa3b4">MCP</text>
  </g>
</svg>
