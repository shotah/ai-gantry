# Sync docs/dockerhub.md → Docker Hub overview + short description.
#
# Hub quirks (why not the root readme):
#   - Overview capped at ~25KB (root readme is larger and gets truncated)
#   - SVG / mermaid / relative asset paths often fail to render
#   - Categories are set in the Hub UI (not via this action) — see docs/dockerhub.md
#
# Secrets:
#   DOCKER_HUB_USERNAME      — Hub username (e.g. shotah), not email
#   DOCKER_HUB_ACCESS_TOKEN  — Personal Access Token with Read, Write, AND Delete
#
# Image push only needs Write. Updating the Hub README uses a PATCH that Docker
# treats as admin → Forbidden unless Delete is also granted on the token.
# Create/rotate: https://hub.docker.com/settings/security → New Access Token
name: dockerhub-description

on:
  push:
    branches: [main]
    paths:
      - docs/dockerhub.md
      - assets/banner.png
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockerhub:
    name: Publish Hub overview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: shotah/ai-gantry
          readme-filepath: ./docs/dockerhub.md
          # Max 100 chars — shows in Hub search / docker search
          short-description: Outbound-only personal agent — Distroless Go, MCP tools, Telegram/Discord/Slack. No open ports.
          enable-url-completion: true
