# Consumes the published ai-gantry harness (no harness source in this repo).
#   make init && make up
#
# No ports. Healthcheck is an exit code. MCP binaries are not in this image —
# uncomment servers in mcp.toml only after static tool binaries are on PATH
# (custom image FROM shotah/ai-gantry).

services:
  gantry:
    image: shotah/ai-gantry:latest   # or :edge / :0.x.y / ghcr.io/shotah/ai-gantry:…
    container_name: gantry
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /data
      TZ: ${TZ:-America/Los_Angeles}
      CRON_TZ: ${TZ:-America/Los_Angeles}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_API_KEY: ${LLM_API_KEY:-${GEMINI_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-${GEMINI_MODEL:-gemini-3.5-flash}}
      CHANNEL: ${CHANNEL:-telegram}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-}
      PERSONA_DIR: /persona
      DATA_DIR: /data
      MCP_MANIFEST: /etc/gantry/mcp.toml
      STREAM_REPLIES: ${STREAM_REPLIES:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Persona is writable so SELF.md (agent personality notes) can grow.
      # Only SELF.md is agent-written; PERSONA.md stays operator-edited.
      # Use :ro here only if you set SELF_NOTES_ENABLED=false.
      - ./persona:/persona
      - ./mcp.toml:/etc/gantry/mcp.toml:ro
      - ./data:/data
      # Yard-wide corkboard (boards-mcp). Same host dir on every crane.
      # - ./boards:/boards
      # Optional tool secrets:
      # - ./secrets/google-mcp:/data/.config/google-mcp
      # - ./secrets/strava:/data/.config/strava
      # - ./secrets/garmin:/data/.config/garmin
      # - ./data/.config/youtube:/data/.config/youtube
    healthcheck:
      test: ["CMD", "/usr/local/bin/gantry", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
