# MCP server manifest — listed = granted (process may start).
# Binaries on PATH (/opt/gantry/bin via systemd unit).
#
# Kernel-only: leave everything commented until static binaries exist.
# Fetch: gantry tools-fetch --manifest /opt/gantry/mcp.toml --outdir /opt/gantry/bin

# --- Google (shotah/google-mcp) ---------------------------------------------
# [[server]]
# name = "google"
# command = "google-mcp"
# args = ["--preset", "everyday"]
# auth_args = ["auth"]
# download_tag = "latest"
# download_url = "https://github.com/shotah/google-mcp/releases/download/{tag}/google-mcp_{version}_{os}_{arch}.tar.gz"

# --- Web search is a gantry builtin (web_search). Do not grant google-search. ---

